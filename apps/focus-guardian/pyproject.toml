[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "focus_guardian"
version = "2.0.0"
description = "Focus Guardian - Productivity body-double for Reachy Mini that helps you stay focused"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Justin Johnson", email = "justin@rundata.run"}
]
keywords = ["reachy-mini", "robot", "productivity", "focus", "pomodoro", "body-double"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "reachy-mini>=1.8.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# heavier detectors, not needed for the default motion-presence path
vision = ["mediapipe>=0.10.0"]

[project.urls]
Homepage = "https://huggingface.co/spaces/RyeCatcher/focus_guardian"

[project.entry-points."reachy_mini_apps"]
focus_guardian = "focus_guardian.app:ReachyMiniFocusGuardian"

[tool.setuptools.packages.find]
where = ["."]
include = ["focus_guardian*"]
